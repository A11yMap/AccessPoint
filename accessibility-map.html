<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Accessibility map</title>
  <meta name="description" content="Accessibility scored for you, not for an average person who doesn't exist.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
  
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>♿</text></svg>">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
  <style>
/* AccessMap — Calder Quay
   Mobile-first. The app itself has to be accessible: real focus rings,
   large targets, semantic colour never used alone, full dark mode. */

:root {
  --topbar-h: 60px;

  --paper: #f3f4f7;
  --card: #ffffff;
  --card-2: #fafbfc;
  --ink: #141922;
  --ink-2: #5c6473;
  --ink-3: #848b99;
  --line: #e2e5ea;
  --accent: #0d5c56;
  --accent-soft: #e3f0ee;
  --on-accent: #ffffff;

  --good: #1f8a5f;
  --ok: #b57410;
  --poor: #cc5c28;
  --blocked: #c2352f;
  --unknown: #757c8a;
  --star: #e0a01c;
  --star-bg: #d5d9e0;

  --feature-pin: #39475e;

  --radius: 14px;
  --shadow: 0 1px 2px rgba(18, 22, 31, .06), 0 6px 20px rgba(18, 22, 31, .07);
  --shadow-sm: 0 1px 2px rgba(18, 22, 31, .07);

  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --display: "Instrument Serif", Georgia, "Times New Roman", serif;

  color-scheme: light;
}

* { box-sizing: border-box; }

[hidden] { display: none !important; }

html, body { height: 100%; }

body {
  margin: 0;
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.5;
  color: var(--ink);
  background: var(--paper);
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3 { margin: 0; line-height: 1.2; font-weight: 600; }
p { margin: 0 0 .6em; }
ul { margin: 0; padding: 0; list-style: none; }

:focus-visible {
  outline: 3px solid var(--accent);
  outline-offset: 2px;
  border-radius: 6px;
}

.skip-link {
  position: absolute; left: -9999px; top: 0; z-index: 100;
  background: var(--accent); color: var(--on-accent);
  padding: 12px 18px; border-radius: 0 0 10px 0; font-weight: 600;
}
.skip-link:focus { left: 0; }

/* ---- topbar ---- */
.topbar {
  position: sticky; top: 0; z-index: 40;
  height: var(--topbar-h);
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px; padding: 0 14px;
  background: color-mix(in srgb, var(--card) 88%, transparent);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
}

.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit; }
.brand__mark { font-size: 26px; color: var(--accent); line-height: 1; }
.brand__text { display: flex; flex-direction: column; line-height: 1.15; }
.brand__name { font-size: 15px; font-weight: 700; letter-spacing: -.01em; }
.brand__name--empty {
  font-weight: 500; color: var(--ink-3); font-style: italic;
  border: 1.5px dashed var(--line); border-radius: 7px;
  padding: 1px 9px; font-size: 13px;
}
.brand__sub { font-size: 11px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .09em; }

.profile-btn {
  display: flex; align-items: center; gap: 9px;
  background: var(--card-2); border: 1px solid var(--line);
  border-radius: 999px; padding: 5px 13px 5px 5px;
  font: inherit; color: inherit; cursor: pointer; max-width: 62vw;
}
.profile-btn:hover { border-color: var(--accent); }
.avatar {
  width: 30px; height: 30px; flex: none; border-radius: 50%;
  background: var(--accent); color: var(--on-accent);
  display: grid; place-items: center; font-weight: 700; font-size: 13px;
}
.profile-btn__text { display: flex; flex-direction: column; line-height: 1.2; min-width: 0; }
.profile-btn__text b { font-size: 13px; }
.profile-btn__text span {
  font-size: 11px; color: var(--ink-3);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

/* ---- buttons ---- */
.btn {
  font: inherit; font-weight: 600; cursor: pointer;
  border-radius: 10px; padding: 11px 18px;
  border: 1px solid transparent; background: var(--card-2); color: var(--ink);
  min-height: 44px;
}
.btn--primary { background: var(--accent); color: var(--on-accent); }
.btn--primary:hover { filter: brightness(1.08); }
.btn--ghost { background: transparent; border-color: var(--line); color: var(--ink-2); }
.btn--ghost:hover { border-color: var(--ink-3); color: var(--ink); }
.btn--outline { background: var(--card); border-color: var(--line); font-weight: 500; text-align: left; }
.btn--outline:hover { border-color: var(--accent); background: var(--accent-soft); }
.btn--small { padding: 8px 13px; font-size: 13px; min-height: 38px; border-radius: 9px; }
.btn--back {
  background: none; border: none; color: var(--ink-2); padding: 8px 0;
  font-weight: 500; margin-bottom: 6px;
}
.btn--back:hover { color: var(--accent); }

/* ---- onboarding ---- */
.screen--onboarding { padding: 24px 18px 60px; }
.onboarding { max-width: 620px; margin: 4vh auto 0; }
.eyebrow {
  text-transform: uppercase; letter-spacing: .14em; font-size: 11px;
  color: var(--accent); font-weight: 700; margin-bottom: 10px;
}
.onboarding h1 {
  font-family: var(--display); font-weight: 400;
  font-size: clamp(30px, 7vw, 46px); letter-spacing: -.01em; margin-bottom: 14px;
}
.lede { color: var(--ink-2); font-size: 15.5px; margin-bottom: 26px; }
.label { display: block; font-weight: 600; margin: 22px 0 6px; }
.hint { color: var(--ink-3); font-size: 13px; }
.field {
  width: 100%; font: inherit; padding: 12px 14px; min-height: 46px;
  border: 1px solid var(--line); border-radius: 10px;
  background: var(--card); color: var(--ink);
}

.chip-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.chip {
  display: inline-flex; align-items: center; gap: 7px;
  font: inherit; font-size: 14px; cursor: pointer; min-height: 42px;
  padding: 9px 15px; border-radius: 999px;
  border: 1.5px solid var(--line); background: var(--card); color: var(--ink-2);
}
.chip:hover { border-color: var(--ink-3); }
.chip.is-on {
  background: var(--accent); border-color: var(--accent);
  color: var(--on-accent); font-weight: 600;
}
.chip.is-on::after { content: " ✓"; }
.chip__icon { font-size: 15px; }

.onboarding__actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 28px; }

/* ---- map screen ---- */
.screen--map { display: grid; grid-template-rows: auto 1fr; }

.map-wrap { position: relative; background: #e9e6df; border-bottom: 1px solid var(--line); }
.map { width: 100%; height: 46vh; min-height: 340px; }
.map--detail { height: 280px; border-radius: var(--radius); border: 1px solid var(--line); overflow: hidden; }
.map-error { padding: 20px; color: var(--ink-2); }

.leaflet-container { font: inherit; background: #e9e6df; }
.leaflet-control-attribution { font-size: 10px; }
.leaflet-control-attribution a { color: var(--ink-2); }
.leaflet-bar a { color: var(--ink); }
.leaflet-tooltip { font-size: 12px; font-weight: 600; border-radius: 7px; }

/* Markers are real DOM buttons, so they get focus rings and labels for free. */
.pin {
  display: block; cursor: pointer;
  filter: drop-shadow(0 2px 4px rgba(20, 25, 34, .3));
}
.pin__dot {
  display: grid; place-items: center;
  width: 32px; height: 32px;
  background: var(--pin-colour); border: 2.5px solid #fff;
  border-radius: 50% 50% 50% 2px;
  transform: rotate(-45deg);
  transition: transform .12s ease;
}
.pin__icon { transform: rotate(45deg); font-size: 15px; line-height: 1; }
.pin--feature .pin__dot { width: 26px; height: 26px; border-width: 2px; }
.pin--feature .pin__icon { font-size: 12px; }
.pin:hover .pin__dot { transform: rotate(-45deg) scale(1.12); }
.pin.is-selected .pin__dot {
  transform: rotate(-45deg) scale(1.2);
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--pin-colour) 35%, transparent);
}

.map-reset {
  position: absolute; right: 12px; top: 12px; z-index: 1001;
  background: var(--card); border: 1px solid var(--line); border-radius: 9px;
  padding: 8px 12px; font: inherit; font-size: 12.5px; font-weight: 600;
  color: var(--ink-2); cursor: pointer; box-shadow: var(--shadow-sm);
}
.map-reset:hover { color: var(--accent); border-color: var(--accent); }

.map-legend {
  position: absolute; left: 12px; top: 12px; z-index: 1001;
  display: flex; flex-wrap: wrap; gap: 4px 12px; max-width: 58%;
  background: color-mix(in srgb, var(--card) 93%, transparent);
  border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 11px; font-size: 11.5px; color: var(--ink-2);
  backdrop-filter: blur(8px); box-shadow: var(--shadow-sm);
}
.legend-item { display: inline-flex; align-items: center; gap: 6px; }
.legend-item i { width: 9px; height: 9px; border-radius: 50%; }

.list-pane { padding: 16px 14px 40px; }
.list-head {
  display: flex; flex-wrap: wrap; gap: 12px;
  align-items: flex-start; justify-content: space-between; margin-bottom: 14px;
}
.list-head h2 { font-size: 17px; }
.switch { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); cursor: pointer; }
.switch input { width: 18px; height: 18px; accent-color: var(--accent); }

.vcard {
  display: flex; gap: 12px; width: 100%; text-align: left; cursor: pointer;
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 13px 14px; margin-bottom: 9px; font: inherit; color: inherit;
  box-shadow: var(--shadow-sm);
}
.vcard:hover { border-color: var(--accent); transform: translateY(-1px); }
.vcard__icon {
  width: 40px; height: 40px; flex: none; border-radius: 10px;
  background: var(--card-2); display: grid; place-items: center; font-size: 19px;
}
.vcard__body { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1; }
.vcard__name { font-weight: 650; font-size: 15px; }
.vcard__meta { font-size: 12.5px; color: var(--ink-3); }
.vcard__score { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
.vcard__score b { font-size: 13px; }

.empty { color: var(--ink-3); padding: 20px 4px; }

/* ---- stars ---- */
.stars { position: relative; display: inline-block; white-space: nowrap; line-height: 1; }
.stars__bg, .stars__fg { font-size: 15px; letter-spacing: 1.5px; }
.stars__bg { color: var(--star-bg); }
.stars__fg {
  color: var(--star); position: absolute; left: 0; top: 0;
  overflow: hidden; white-space: nowrap;
}

/* ---- badges & need chips ---- */
.badge {
  font-size: 11px; font-weight: 650; padding: 3px 9px; border-radius: 999px;
  border: 1px solid currentColor; white-space: nowrap;
}
.badge--good { color: var(--good); }
.badge--ok { color: var(--ok); }
.badge--poor { color: var(--poor); }
.badge--blocked { color: var(--blocked); background: color-mix(in srgb, var(--blocked) 12%, transparent); }
.badge--sparse, .badge--unknown { color: var(--unknown); }

.need-chips { display: inline-flex; flex-wrap: wrap; gap: 4px; }
.need-chip {
  font-size: 10.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px;
  background: var(--accent-soft); color: var(--accent); white-space: nowrap;
}
.need-chip--warn {
  background: color-mix(in srgb, var(--blocked) 14%, transparent);
  color: var(--blocked); margin-left: 6px;
}

/* ---- venue detail ---- */
.screen--venue { padding: 18px 16px 60px; }
.detail { max-width: 760px; margin: 0 auto; }
.detail__head { margin-bottom: 18px; }
.detail__head h1 {
  font-family: var(--display); font-weight: 400;
  font-size: clamp(27px, 6.5vw, 40px); margin-bottom: 8px;
}

.block { margin: 30px 0; }
.block > h2 { font-size: 18px; margin-bottom: 6px; }

.score-card {
  background: var(--card); border: 1px solid var(--line);
  border-left: 5px solid var(--unknown);
  border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow);
}
.score-card--good { border-left-color: var(--good); }
.score-card--ok { border-left-color: var(--ok); }
.score-card--poor { border-left-color: var(--poor); }
.score-card--blocked { border-left-color: var(--blocked); }
.score-card--sparse, .score-card--unknown { border-left-color: var(--unknown); }

.score-card__main { display: flex; align-items: center; gap: 18px; }
.score-card__number { display: flex; align-items: baseline; gap: 3px; }
.score-card__value { font-size: 46px; font-weight: 700; letter-spacing: -.03em; line-height: 1; }
.score-card__dash { font-size: 46px; font-weight: 300; color: var(--ink-3); line-height: 1; }
.score-card__outof { font-size: 15px; color: var(--ink-3); font-weight: 600; }
.score-card__label { font-weight: 650; margin: 5px 0 1px; }
.score-card__for { font-size: 12.5px; color: var(--ink-3); margin: 0; }
.score-card__note { font-size: 13px; color: var(--ink-2); margin: 12px 0 0; }

.coverage { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); }
.coverage__bar { height: 7px; border-radius: 99px; background: var(--star-bg); overflow: hidden; }
.coverage__bar span { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.coverage__text { font-size: 12.5px; color: var(--ink-2); margin: 8px 0 0; }

.blockers {
  margin-top: 14px; padding: 16px 18px; border-radius: var(--radius);
  background: color-mix(in srgb, var(--blocked) 9%, var(--card));
  border: 1px solid color-mix(in srgb, var(--blocked) 32%, transparent);
}
.blockers h2 { font-size: 16px; color: var(--blocked); margin-bottom: 4px; }
.blockers__why { font-size: 12.5px; color: var(--ink-2); }
.blockers li { padding: 7px 0; border-top: 1px solid color-mix(in srgb, var(--blocked) 18%, transparent); font-size: 14px; }

/* features */
.detail-map { margin: 12px 0 14px; }
.feature { margin-bottom: 8px; }
.feature__btn {
  display: flex; gap: 12px; width: 100%; text-align: left; cursor: pointer;
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 12px 14px; font: inherit; color: inherit;
}
.feature__btn:hover { border-color: var(--accent); }
.feature__btn > span:last-child { display: flex; flex-direction: column; gap: 2px; }
.feature__icon {
  width: 34px; height: 34px; flex: none; border-radius: 9px;
  background: var(--card-2); display: grid; place-items: center; font-size: 16px;
}
.feature__name { font-weight: 650; }
.feature__kind { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); }
.feature__detail { font-size: 13.5px; color: var(--ink-2); margin-top: 3px; }
.feature__locate { font-size: 12.5px; color: var(--accent); font-weight: 600; margin-top: 5px; }

/* attribute rows */
.rows { margin-top: 10px; }
.row {
  display: flex; gap: 11px; padding: 12px 0;
  border-bottom: 1px solid var(--line);
}
.row__dot {
  width: 9px; height: 9px; border-radius: 50%; flex: none; margin-top: 6px;
  background: var(--unknown);
}
.row--good .row__dot { background: var(--good); }
.row--ok .row__dot { background: var(--ok); }
.row--bad .row__dot { background: var(--poor); }
.row__body { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.row__label { font-size: 11.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-3); font-weight: 650; }
.row__value { font-size: 14.5px; }
.row--bad .row__value { font-weight: 600; }
.row__foot { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 5px; }
.row__verified { font-size: 11px; color: var(--ink-3); }
.row__verified.is-stale { color: var(--poor); font-weight: 600; }
.row--muted { opacity: .62; }

.other { margin: 24px 0; }
.other summary { cursor: pointer; font-weight: 600; padding: 12px 0; color: var(--ink-2); }

/* stale + gaps */
.stale, .gaps {
  margin: 26px 0; padding: 18px; border-radius: var(--radius);
  background: var(--card); border: 1px dashed var(--line);
}
.stale h2, .gaps h2 { font-size: 17px; margin-bottom: 5px; }
.stale__item { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
.stale__item p { margin-bottom: 4px; font-size: 14px; }
.stale__actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.gap { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); }
.gap__q { font-weight: 650; margin-bottom: 8px; }
.gap__opts { display: flex; flex-direction: column; gap: 7px; }
.thanks { color: var(--good); font-weight: 600; font-size: 14px; margin: 0; }

/* reviews */
.review {
  background: var(--card); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 15px; margin-bottom: 10px;
}
.review--match { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.review__head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.review__head > div { display: flex; flex-direction: column; gap: 5px; }
.review__match { font-size: 11.5px; color: var(--accent); font-weight: 650; margin: 9px 0 0; }
.review__body { margin: 8px 0 0; color: var(--ink-2); font-size: 14px; }

/* dialog */
dialog {
  border: none; border-radius: 18px; padding: 0; max-width: 560px; width: calc(100% - 32px);
  background: var(--card); color: var(--ink); box-shadow: var(--shadow);
}
dialog::backdrop { background: rgba(10, 14, 20, .5); backdrop-filter: blur(3px); }
.dialog { padding: 22px; }
.dialog h2 { font-size: 20px; margin-bottom: 5px; }
.dialog__actions { display: flex; justify-content: space-between; gap: 10px; margin-top: 24px; }

/* ---- desktop ---- */
@media (min-width: 900px) {
  .screen--map {
    grid-template-rows: none;
    grid-template-columns: minmax(0, 1.35fr) minmax(360px, .9fr);
    height: calc(100vh - var(--topbar-h));
    min-height: 560px;
  }
  .map-wrap { border-bottom: none; border-right: 1px solid var(--line); height: 100%; }
  .map { height: 100%; min-height: 0; }
  .list-pane { overflow-y: auto; padding: 20px 18px 40px; }
  .screen--venue { overflow-y: auto; height: calc(100vh - var(--topbar-h)); min-height: 560px; padding: 26px 20px 80px; }
  .map--detail { height: 320px; }
  body { font-size: 15.5px; }
}

@media (max-width: 560px) {
  .map-legend {
    max-width: none; left: 8px; right: 8px; top: 8px;
    font-size: 10.5px; gap: 3px 10px; padding: 7px 9px;
  }
  .map { height: 42vh; min-height: 300px; }
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
  .vcard:hover { transform: none; }
}

.vcard__why { font-size: 12px; color: var(--ink-2); margin-top: 4px; line-height: 1.4; }
  </style>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="topbar">
    <a class="brand" href="#/">
      <span class="brand__mark" aria-hidden="true">◍</span>
      <span class="brand__text">
        <span id="brand-name"></span>
        <span id="brand-sub" class="brand__sub"></span>
      </span>
    </a>
    <button id="profile-btn" class="profile-btn" type="button" hidden></button>
  </header>

  <main id="main">
    <section id="screen-onboarding" class="screen screen--onboarding" hidden></section>
    <section id="screen-map" class="screen screen--map" hidden></section>
    <section id="screen-venue" class="screen screen--venue" hidden></section>
  </main>

  <dialog id="profile-dialog"></dialog>

<script type="module">
// ===== js/config.js ==================================================
// ---------------------------------------------------------------------------
// APP NAME — not chosen yet. Type it between the quotes and it appears
// everywhere: the tab title, the header and the welcome screen.
// While it is empty the header shows a dashed "name goes here" placeholder.
// ---------------------------------------------------------------------------
const APP_NAME = '';

/** The district the sample venues sit in. */
const DISTRICT = 'Bristol Harbourside';

/** Where the map opens. */
const MAP_VIEW = {
  center: [-2.5966, 51.4496], // [lng, lat]
  zoom: 16,
  minZoom: 13,
  maxZoom: 19,
};

/**
 * Basemap: standard OpenStreetMap tiles — open data, open source, no API key.
 * Swap `tiles` for any other XYZ tile URL (and update the attribution) if you
 * later want a different cartographic style.
 */
const BASEMAP = {
  tiles: 'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
};

// ===== js/data/needs.js ==============================================
// The access needs a person can have on their profile.
// Everything in the app is scored relative to whichever of these are switched on.

const NEEDS = [
  { id: 'wheelchair', label: 'Wheelchair user',      short: 'Wheelchair',   icon: '♿' },
  { id: 'mobility',   label: 'Limited mobility / fatigue', short: 'Mobility', icon: '🦯' },
  { id: 'blind',      label: 'Blind',                short: 'Blind',        icon: '👁' },

// ===== js/data/attributes.js =========================================
// The attribute registry.
//
// This is the core of the app. A venue stores plain FACTS ("ordering is by
// touchscreen"). This registry decides what each fact MEANS for each access need.
//
// Per need:
//   w     relevance weight 0–10. Absent = irrelevant to that need, so it is
//         hidden from that person's details and never affects their score.
//   rate  how good each possible value is for that need, 0 (useless) – 1 (ideal).
//   gate  values that make the place unusable for that need. A gate is not a low
//         score, it is a hard stop — one 15cm step is not "92% accessible".
//
// Note `ordering` and `lighting`: the same fact scores in OPPOSITE directions for
// different needs. A touchscreen kiosk is a wall for a blind customer and a relief
// for a non-speaking one. That is the whole reason this app exists.

const VENUE_BY_ID = Object.fromEntries(VENUES.map(v => [v.id, v]));

/** Normalise the shorthand attr format into { value, verified, source }. */
function readAttr(venue, attrId) {
  const raw = venue.attrs[attrId];
  if (raw === undefined) return null;
  return Array.isArray(raw)
    ? { value: raw[0], verified: raw[1], source: raw[2] }
    : { value: raw, verified: venue.updated, source: venue.source };
}

const reviewsFor = venueId => REVIEWS.filter(r => r.venueId === venueId);

/** Reviews from people who share at least one of your needs come first. */
function sortReviewsForProfile(reviews, needIds) {
  const mine = new Set(needIds ?? []);
  return [...reviews].sort((a, b) => {
    const aShared = a.needs.filter(n => mine.has(n)).length;
    const bShared = b.needs.filter(n => mine.has(n)).length;
    if (aShared !== bShared) return bShared - aShared;
    return b.date.localeCompare(a.date);
  });
}

// ===== js/scoring.js =================================================
// The scoring engine.
//
// A venue does not have an accessibility score. A venue + a person has a score.
// Everything here takes the viewer's access needs as an argument.




const ALL_NEED_IDS = NEEDS.map(n => n.id);
const STALE_AFTER_MONTHS = 18;

function monthsSince(dateStr) {
  const then = new Date(dateStr + 'T00:00:00');
  const now = new Date();
  return (now.getFullYear() - then.getFullYear()) * 12 + (now.getMonth() - then.getMonth());
}

const isStale = dateStr => monthsSince(dateStr) >= STALE_AFTER_MONTHS;

function formatVerified(dateStr) {
  const months = monthsSince(dateStr);
  if (months < 1) return 'checked this month';
  if (months === 1) return 'checked last month';
  if (months < 12) return `checked ${months} months ago`;
  const years = Math.floor(months / 12);
  return `checked over ${years} year${years > 1 ? 's' : ''} ago`;
}

const SOURCE_LABEL = {
  community: 'Reported by visitors',
  venue: 'Provided by the venue',
  audit: 'Independent access audit',
  osm: 'Imported from OpenStreetMap',
};
const sourceLabel = s => SOURCE_LABEL[s] ?? s;

/**
 * Score a venue for one person's set of access needs.
 * An empty profile falls back to "everyone", which is the honest answer to
 * "how accessible is this in general" — an average over every need.
 */
function scoreVenue(venue, needIds) {
  const active = needIds?.length ? needIds : ALL_NEED_IDS;

  const rows = [];      // relevant to this person, sorted by relevance below
  const otherRows = []; // known, but irrelevant to this person
  const blockers = [];
  let weighted = 0;
  let totalWeight = 0;
  let known = 0;
  let relevantCount = 0;

  for (const attr of ATTRIBUTES) {
    if (!appliesToVenue(attr, venue)) continue;

    const matched = active
      .filter(id => attr.needs[id])
      .map(id => ({ id, ...attr.needs[id] }));

    const fact = readAttr(venue, attr.id);

    if (matched.length === 0) {
      if (fact) {
        otherRows.push(buildRow(attr, fact, [], 0, null));
      }
      continue;
    }

    relevantCount++;

    if (!fact) {
      // An unknown is NOT a pass. It is counted against coverage and shown as a gap.
      rows.push(buildRow(attr, null, matched, Math.max(...matched.map(m => m.w)), null));
      continue;
    }

    known++;

    let attrWeighted = 0;
    let attrWeight = 0;
    const hitNeeds = [];

    for (const m of matched) {
      const rating = m.rate?.[fact.value] ?? 0.5;
      attrWeighted += m.w * rating;
      attrWeight += m.w;
      hitNeeds.push({ id: m.id, w: m.w, rating });

      if (m.gate?.includes(fact.value)) {
        blockers.push({
          attrId: attr.id,
          label: attr.label,
          text: attr.values[fact.value],
          needId: m.id,
          needLabel: needLabel(m.id),
        });
      }
    }

    weighted += attrWeighted;
    totalWeight += attrWeight;

    rows.push(buildRow(attr, fact, hitNeeds, Math.max(...hitNeeds.map(h => h.w)), attrWeighted / attrWeight));
  }

  // Most relevant first; within equal relevance, surface the problems.
  rows.sort((a, b) => b.relevance - a.relevance || (a.rating ?? 2) - (b.rating ?? 2));
  otherRows.sort((a, b) => a.group.localeCompare(b.group));

  const hasData = known > 0;
  const ratio = totalWeight > 0 ? weighted / totalWeight : null;
  const status = statusFor(blockers.length > 0, hasData, ratio, known, relevantCount);

  // Two cases where showing a number would be a lie:
  //  - Below half coverage. Four facts out of eleven is not "5.0", it is
  //    "we barely know anything about this place".
  //  - A gate is violated. "2.5 out of 5, and also you physically cannot get in"
  //    is incoherent; the blockers are the answer, not an average.
  const confident = hasData && status !== 'sparse' && blockers.length === 0;

  return {
    venue,
    needIds: active,
    usingFallbackProfile: !needIds?.length,
    blocked: blockers.length > 0,
    blockers,
    confident,
    stars: confident ? Math.round(ratio * 5 * 10) / 10 : null,
    coverage: {
      known,
      total: relevantCount,
      pct: relevantCount ? Math.round((known / relevantCount) * 100) : 0,
    },
    rows,
    otherRows,
    status,
  };
}

function buildRow(attr, fact, hitNeeds, relevance, rating) {
  return {
    attrId: attr.id,
    group: attr.group,
    label: attr.label,
    value: fact?.value ?? null,
    text: fact ? attr.values[fact.value] : null,
    verified: fact?.verified ?? null,
    source: fact?.source ?? null,
    stale: fact ? isStale(fact.verified) : false,
    relevance,
    rating,
    needs: hitNeeds,
    tone: toneFor(rating),
  };
}

function toneFor(rating) {
  if (rating === null || rating === undefined) return 'unknown';
  if (rating >= 0.75) return 'good';
  if (rating >= 0.45) return 'ok';
  return 'bad';
}

function statusFor(blocked, hasData, ratio, known, total) {
  if (blocked) return 'blocked';
  if (!hasData) return 'unknown';
  if (total > 0 && known / total < 0.5) return 'sparse';
  if (ratio >= 0.7) return 'good';
  if (ratio >= 0.45) return 'ok';
  return 'poor';
}

const STATUS_META = {
  good:    { label: 'Works for you',      pin: '#1f8a5f' },
  ok:      { label: 'Partly works',       pin: '#c98211' },
  poor:    { label: 'Difficult for you',  pin: '#d2622e' },
  blocked: { label: "You can't get in",   pin: '#c2352f' },
  sparse:  { label: 'Barely any data',    pin: '#7a8091' },
  unknown: { label: 'No data yet',        pin: '#7a8091' },
};

/** Which of this person's needs does the venue serve worst? Used for the summary line. */
function weakestNeed(result) {
  const byNeed = new Map();
  for (const row of result.rows) {
    if (row.rating === null) continue;
    for (const n of row.needs) {
      const cur = byNeed.get(n.id) ?? { sum: 0, w: 0 };
      cur.sum += n.w * n.rating;
      cur.w += n.w;
      byNeed.set(n.id, cur);
    }
  }
  let worst = null;
  for (const [id, { sum, w }] of byNeed) {
    if (!w) continue;
    const score = sum / w;
    if (!worst || score < worst.score) worst = { id, score };
  }
  return worst;
}

// ===== js/store.js ===================================================
// Account, access preferences and user contributions.
// Prototype: everything lives in localStorage, no server, no real auth.


const KEY = 'calderquay.v1';

const DEFAULT_STATE = {
  account: null,          // { name, needs: [] }
  contributions: {},      // { [venueId]: { [attrId]: value } }
  confirmations: {},      // { [venueId]: { [attrId]: 'YYYY-MM-DD' } }
};

let state = load();
const listeners = new Set();

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) return { ...DEFAULT_STATE, ...JSON.parse(raw) };
  } catch { /* corrupt or blocked storage — fall through to defaults */ }
  return structuredClone(DEFAULT_STATE);
}

function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify(state));
  } catch { /* private browsing — the app still works, it just won't persist */ }
}

function emit() {
  save();
  for (const fn of listeners) fn(state);
}

const subscribe = fn => { listeners.add(fn); return () => listeners.delete(fn); };

const getState = () => state;
const getAccount = () => state.account;
const getNeeds = () => state.account?.needs ?? [];
const isSignedIn = () => Boolean(state.account);

function signIn(name, needs) {
  state.account = { name: name.trim() || 'Guest', needs: [...needs] };
  emit();
}

function signOut() {
  state = structuredClone(DEFAULT_STATE);
  emit();
}

function setNeeds(needs) {
  if (!state.account) return;
  state.account.needs = [...needs];
  emit();
}

/** Record a fact a user contributed from the venue page. */
function contribute(venueId, attrId, value) {
  state.contributions[venueId] ??= {};
  state.contributions[venueId][attrId] = value;
  emit();
}

/** Re-confirm an existing fact that had gone stale. */
function confirm(venueId, attrId) {
  state.confirmations[venueId] ??= {};
  state.confirmations[venueId][attrId] = today();
  emit();
}

const hasContributed = (venueId, attrId) =>
  Boolean(state.contributions[venueId]?.[attrId] || state.confirmations[venueId]?.[attrId]);

const contributionCount = () =>
  Object.values(state.contributions).reduce((n, o) => n + Object.keys(o).length, 0) +
  Object.values(state.confirmations).reduce((n, o) => n + Object.keys(o).length, 0);

const today = () => new Date().toISOString().slice(0, 10);

/**
 * A venue with this user's contributions merged in, so a fact they add on the
 * venue page immediately changes their score.
 */
function withContributions(venue) {
  const added = state.contributions[venue.id];
  const confirmed = state.confirmations[venue.id];
  if (!added && !confirmed) return venue;

  const attrs = { ...venue.attrs };
  for (const [attrId, value] of Object.entries(added ?? {})) {
    attrs[attrId] = [value, today(), 'community'];
  }
  for (const attrId of Object.keys(confirmed ?? {})) {
    const raw = attrs[attrId];
    const value = Array.isArray(raw) ? raw[0] : raw;
    if (value !== undefined) attrs[attrId] = [value, confirmed[attrId], 'community'];
  }
  return { ...venue, attrs };
}

const allVenues = () => VENUES.map(withContributions);
const venueById = id => {
  const v = VENUES.find(x => x.id === id);
  return v ? withContributions(v) : null;
};

// `import * as store` becomes a plain namespace object.
const store = { subscribe, getState, getAccount, getNeeds, isSignedIn, signIn, signOut, setNeeds, contribute, confirm, hasContributed, contributionCount, withContributions, allVenues, venueById };

// ===== js/map.js =====================================================
// Real map: Leaflet over OpenStreetMap tiles.
//
// Deliberately raster + DOM tiles rather than a WebGL vector map. Tiles are
// plain <img> elements, so the map paints on any machine and in any embed with
// no GPU requirement — a blank map in front of an audience is not a risk worth
// taking for slightly crisper labels.
//
// Venue pins are coloured by how the place scores FOR THE CURRENT USER, so
// changing your access profile visibly repaints the neighbourhood.
//
// Feature pins (entrances, toilets, lifts, parking) sit at their own real
// coordinates — that is what lets the app point at the step-free door rather
// than at the middle of the building.




function createMap(container, { onSelectVenue, onSelectFeature, interactive = true } = {}) {
  const L = window.L;
  if (!L) {
    container.innerHTML = '<p class="map-error">Map library did not load. Check your connection and reload.</p>';
    return stub();
  }

  const map = L.map(container, {
    center: [MAP_VIEW.center[1], MAP_VIEW.center[0]],
    zoom: Math.round(MAP_VIEW.zoom),
    minZoom: MAP_VIEW.minZoom,
    maxZoom: MAP_VIEW.maxZoom,
    zoomControl: false,
    dragging: interactive,
    scrollWheelZoom: interactive,
  });

  if (interactive) L.control.zoom({ position: 'bottomright' }).addTo(map);

  L.tileLayer(BASEMAP.tiles, {
    attribution: BASEMAP.attribution,
    maxZoom: MAP_VIEW.maxZoom,
    // detectRetina doubles the tile count; OSM throttles, so keep requests lean.
    detectRetina: false,
  }).addTo(map);

  // Leaflet measures its container on creation; if it has not been laid out yet
  // (or the pane is resized later) the tile grid is wrong, so keep them in step.
  const ro = new ResizeObserver(() => map.invalidateSize());
  ro.observe(container);
  // Layout can settle after creation (web fonts, late grid sizing, a hidden tab
  // becoming visible). Without this the tile grid is computed for the wrong box
  // and the map paints as a half-loaded strip.
  const nudges = [0, 120, 400, 1000].map(t => setTimeout(() => map.invalidateSize(), t));
  map.whenReady(() => map.invalidateSize());

  let venueMarkers = new Map();
  let featureMarkers = [];
  let selectedId = null;

  function pinIcon({ icon, colour, kind }) {
    const size = kind === 'venue' ? [34, 42] : [28, 34];
    return L.divIcon({
      className: '',
      html: `<span class="pin pin--${kind}" style="--pin-colour:${colour}">
               <span class="pin__dot"><span class="pin__icon">${icon}</span></span>
             </span>`,
      iconSize: size,
      iconAnchor: [size[0] / 2, size[1]],
    });
  }

  function clearFeatures() {
    for (const m of featureMarkers) m.remove();
    featureMarkers = [];
  }

  return {
    map,

    render(venues, scoreFn) {
      for (const m of venueMarkers.values()) m.remove();
      venueMarkers = new Map();

      for (const v of venues) {
        const { status } = scoreFn(v);
        const meta = STATUS_META[status];
        const marker = L.marker([v.lat, v.lng], {
          icon: pinIcon({ icon: CATEGORIES[v.category]?.icon ?? '\u{1F4CD}', colour: meta.pin, kind: 'venue' }),
          keyboard: true,
          title: `${v.name} — ${meta.label}`,
          alt: `${v.name} — ${meta.label}`,
          riseOnHover: true,
        }).addTo(map);
        marker.on('click', () => onSelectVenue?.(v.id));
        marker.on('keypress', e => {
          if (e.originalEvent?.key === 'Enter') onSelectVenue?.(v.id);
        });
        if (v.id === selectedId) marker.getElement()?.classList.add('is-selected');
        venueMarkers.set(v.id, marker);
      }
    },

    setSelected(id) {
      selectedId = id;
      for (const [vid, marker] of venueMarkers) {
        marker.getElement()?.classList.toggle('is-selected', vid === id);
      }
    },

    /** Drop a pin on every located feature of this venue. */
    setFocus(venue) {
      clearFeatures();
      if (!venue) return;
      for (const f of venue.features) {
        const meta = FEATURE_KINDS[f.kind] ?? { label: f.kind, icon: '\u{1F4CD}' };
        const marker = L.marker([f.lat, f.lng], {
          icon: pinIcon({ icon: meta.icon, colour: 'var(--feature-pin)', kind: 'feature' }),
          title: `${f.name} — ${venue.name}`,
          alt: `${f.name} — ${venue.name}`,
        }).addTo(map);
        marker.bindTooltip(f.name, { direction: 'top', offset: [0, -34] });
        marker.on('click', () => onSelectFeature?.(venue, f));
        marker.featureName = f.name;
        featureMarkers.push(marker);
      }
    },

    highlightFeature(name) {
      for (const m of featureMarkers) {
        const on = m.featureName === name;
        m.getElement()?.classList.toggle('is-selected', on);
        if (on) m.openTooltip();
      }
    },

    flyTo(lng, lat, zoom = 19) {
      map.flyTo([lat, lng], Math.min(zoom, MAP_VIEW.maxZoom), { duration: 0.9 });
    },

    fitTo(points, padding = 60) {
      if (!points.length) return;
      const bounds = L.latLngBounds(points.map(p => [p.lat, p.lng]));
      map.fitBounds(bounds, { padding: [padding, padding], maxZoom: 18, animate: false });
    },

    reset() {
      map.flyTo([MAP_VIEW.center[1], MAP_VIEW.center[0]], Math.round(MAP_VIEW.zoom), { duration: 0.9 });
    },
    resize() { map.invalidateSize(); },
    destroy() {
      clearFeatures();
      ro.disconnect();
      for (const id of nudges) clearTimeout(id);
      map.remove();
    },
  };
}

const noop = () => {};
const stub = () => ({
  render: noop, setSelected: noop, setFocus: noop, highlightFeature: noop,
  flyTo: noop, fitTo: noop, reset: noop, resize: noop, destroy: noop,
});

// Screen rendering.









// ---- tiny DOM helper -----------------------------------------------------
function h(tag, props = {}, kids = []) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (v === false || v === null || v === undefined) continue;
    if (k === 'class') node.className = v;
    else if (k === 'html') node.innerHTML = v;
    else if (k === 'text') node.textContent = v;
    else if (k.startsWith('on')) node.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === 'dataset') Object.assign(node.dataset, v);
    else node.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of [].concat(kids)) {
    if (kid === null || kid === undefined || kid === false) continue;
    node.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return node;
}

const $ = sel => document.querySelector(sel);

/**
 * The app has no name yet. Until APP_NAME is filled in (js/config.js) the header
 * shows a dashed, clearly-empty slot rather than inventing a placeholder name.
 */
function renderBrand() {
  const name = APP_NAME.trim();
  const slot = $('#brand-name');
  const sub = $('#brand-sub');

  slot.className = name ? 'brand__name' : 'brand__name brand__name--empty';
  slot.textContent = name || 'Your app name';
  slot.title = name ? '' : 'Set APP_NAME in js/config.js';
  sub.textContent = DISTRICT;
  document.title = name ? `${name} — ${DISTRICT}` : `Accessibility map — ${DISTRICT}`;
}

// ---- shared bits ---------------------------------------------------------

function stars(value) {
  const pct = value === null ? 0 : (value / 5) * 100;
  return h('span', { class: 'stars', role: 'img', 'aria-label': value === null ? 'Not rated' : `${value} out of 5` }, [
    h('span', { class: 'stars__bg', 'aria-hidden': 'true', text: '★★★★★' }),
    h('span', { class: 'stars__fg', 'aria-hidden': 'true', style: `width:${pct}%`, text: '★★★★★' }),
  ]);
}

const statusBadge = status =>
  h('span', { class: `badge badge--${status}`, text: STATUS_META[status].label });

const needChips = (ids, extra = '') =>
  h('span', { class: 'need-chips' }, ids.map(id =>
    h('span', { class: `need-chip ${extra}`, text: needLabel(id) })));

// ---- onboarding ----------------------------------------------------------

function renderOnboarding(root) {
  let picked = new Set();

  const chipRow = h('div', { class: 'chip-grid' }, NEEDS.map(n => {
    const btn = h('button', {
      class: 'chip', type: 'button', 'aria-pressed': 'false',
      onclick: () => {
        picked.has(n.id) ? picked.delete(n.id) : picked.add(n.id);
        btn.setAttribute('aria-pressed', String(picked.has(n.id)));
        btn.classList.toggle('is-on', picked.has(n.id));
      },
    }, [h('span', { class: 'chip__icon', 'aria-hidden': 'true', text: n.icon }), n.label]);
    return btn;
  }));

  const name = h('input', {
    class: 'field', id: 'name-input', type: 'text',
    placeholder: 'e.g. Maya', autocomplete: 'given-name',
  });

  root.replaceChildren(
    h('div', { class: 'onboarding' }, [
      h('p', { class: 'eyebrow', text: DISTRICT }),
      h('h1', { text: 'Accessibility is not one number.' }),
      h('p', { class: 'lede', text: 'A café with a ramp can still be unusable if you are blind, and a touchscreen that shuts one person out is the reason another can order at all. So tell us how you get around, and every place in the district will be scored for you — not for an average person who does not exist.' }),

      h('label', { class: 'label', for: 'name-input', text: 'What should we call you?' }),
      name,

      h('p', { class: 'label', text: 'How do you get around?' }),
      h('p', { class: 'hint', text: 'Pick everything that applies. You can change this at any time, and nobody else sees it.' }),
      chipRow,

      h('div', { class: 'onboarding__actions' }, [
        h('button', {
          class: 'btn btn--primary', type: 'button', text: 'Create my profile',
          onclick: () => store.signIn(name.value, [...picked]),
        }),
        h('button', {
          class: 'btn btn--ghost', type: 'button', text: 'Look around without a profile',
          onclick: () => store.signIn('Guest', []),
        }),
      ]),
    ]),
  );
}

// ---- map screen ----------------------------------------------------------

let mapInstance = null;
let onlyWorkingForMe = false;

function renderMapScreen(root, { onOpenVenue }) {
  const needs = store.getNeeds();
  const venues = store.allVenues();
  const score = v => scoreVenue(v, needs);

  if (!root.dataset.built) {
    root.replaceChildren(
      h('div', { class: 'map-wrap' }, [
        h('div', { id: 'map', class: 'map', role: 'application', 'aria-label': `Map of ${DISTRICT}` }),
        h('button', { class: 'map-reset', type: 'button', text: 'Reset view', onclick: () => mapInstance.reset() }),
        h('div', { class: 'map-legend' }, Object.entries(STATUS_META)
          .filter(([k]) => k !== 'sparse')
          .map(([k, m]) => h('span', { class: 'legend-item' }, [
            h('i', { style: `background:${m.pin}` }), m.label,
          ]))),
      ]),
      h('div', { class: 'list-pane', id: 'venue-list' }),
    );
    // The SVG element is replaced above, so build the map against the live node.
    mapInstance = createMap(root.querySelector('#map'), {
      onSelectVenue: id => onOpenVenue(id),
    });
    root.dataset.built = '1';
  }

  mapInstance.render(venues, score);

  const scored = venues.map(v => ({ v, r: score(v) }))
    .sort((a, b) => rank(b.r) - rank(a.r));

  const shown = onlyWorkingForMe
    ? scored.filter(({ r }) => r.status === 'good' || r.status === 'ok')
    : scored;

  const list = root.querySelector('#venue-list');
  list.replaceChildren(
    h('div', { class: 'list-head' }, [
      h('div', {}, [
        h('h2', { text: `${venues.length} places in ${DISTRICT}` }),
        h('p', { class: 'hint', text: needs.length
          ? `Scored for ${needs.map(needLabel).join(', ').toLowerCase()}`
          : 'No profile set — showing an average across every access need' }),
      ]),
      h('label', { class: 'switch' }, [
        h('input', {
          type: 'checkbox', checked: onlyWorkingForMe,
          onchange: e => { onlyWorkingForMe = e.target.checked; renderMapScreen(root, { onOpenVenue }); },
        }),
        h('span', { text: 'Only places that work for me' }),
      ]),
    ]),
    ...shown.map(({ v, r }) => venueCard(v, r, onOpenVenue)),
    shown.length === 0 ? h('p', { class: 'empty', text: 'Nothing here fully works for your profile yet. That is the point of the filter — it makes the gap visible.' }) : null,
  );
}

const rank = r => (r.status === 'blocked' ? -1 : r.stars ?? -0.5);

function venueCard(v, r, onOpenVenue) {
  return h('button', {
    class: 'vcard', type: 'button',
    onclick: () => onOpenVenue(v.id),
    onmouseenter: () => mapInstance?.setSelected(v.id),
    onfocus: () => mapInstance?.setSelected(v.id),
  }, [
    h('span', { class: 'vcard__icon', 'aria-hidden': 'true', text: CATEGORIES[v.category].icon }),
    h('span', { class: 'vcard__body' }, [
      h('span', { class: 'vcard__name', text: v.name }),
      h('span', { class: 'vcard__meta', text: `${CATEGORIES[v.category].label} · ${v.address}` }),
      h('span', { class: 'vcard__score' }, [
        r.stars !== null ? stars(r.stars) : null,
        r.stars !== null ? h('b', { text: r.stars.toFixed(1) }) : null,
        statusBadge(r.status),
      ]),
      r.stars === null ? h('span', { class: 'vcard__why', text: r.blocked
        ? r.blockers.map(b => b.text).join(' · ')
        : `Only ${r.coverage.known} of ${r.coverage.total} things are known — not enough to rate` }) : null,
    ]),
  ]);
}

// ---- venue detail --------------------------------------------------------

let detailMap = null;

function renderVenueScreen(root, venueId, { onBack, rerender }) {
  const venue = store.venueById(venueId);
  if (!venue) { onBack(); return; }

  const needs = store.getNeeds();
  const r = scoreVenue(venue, needs);
  const cat = CATEGORIES[venue.category];

  const mapBox = h('div', { class: 'map map--detail', role: 'application', 'aria-label': `Map of ${venue.name} and its accessible features` });

  root.replaceChildren(
    h('div', { class: 'detail' }, [
      h('button', { class: 'btn btn--back', type: 'button', text: '← All places', onclick: onBack }),

      h('header', { class: 'detail__head' }, [
        h('p', { class: 'eyebrow', text: `${cat.icon} ${cat.label} · ${venue.address}` }),
        h('h1', { text: venue.name }),
        h('p', { class: 'lede', text: venue.blurb }),
      ]),

      scoreCard(r, needs),
      r.blocked ? blockerPanel(r) : null,

      section('Where exactly to go', [
        h('p', { class: 'hint', text: 'Tap a pin or a row to see precisely where it is. Entrances, toilets and lifts each have their own location — because “the building is accessible” is not directions.' }),
        h('div', { class: 'detail-map' }, [mapBox]),
        h('ul', { class: 'features' }, venue.features.map(f => featureRow(venue, f))),
      ]),

      staleSection(venue, r, rerender),
      section(`What matters to you${needs.length ? '' : ' (all needs)'}`, [
        h('p', { class: 'hint', text: 'Sorted by how much each one affects you. Things that are irrelevant to your profile are tucked away at the bottom.' }),
        h('ul', { class: 'rows' }, r.rows.filter(row => row.value).map(row => detailRow(row))),
      ]),

      gapsSection(venue, r, rerender),

      r.otherRows.length ? h('details', { class: 'other' }, [
        h('summary', { text: `Other details (${r.otherRows.length}) — not relevant to your profile` }),
        h('ul', { class: 'rows' }, r.otherRows.map(row => detailRow(row, true))),
      ]) : null,

      reviewsSection(venue, needs),
    ]),
  );

  detailMap?.destroy();
  detailMap = createMap(mapBox, {
    onSelectVenue: () => {},
    onSelectFeature: (_v, f) => focusFeature(f),
  });
  detailMap.render([venue], () => r);
  detailMap.setFocus(venue);
  // Open framed on the building AND all of its features, so the step-free
  // entrance around the corner is on screen from the start.
  detailMap.fitTo([venue, ...venue.features], 70);

  root.scrollTop = 0;
  window.scrollTo(0, 0);
}

function section(title, kids) {
  return h('section', { class: 'block' }, [h('h2', { text: title }), ...[].concat(kids)]);
}

function scoreCard(r, needs) {
  const worst = weakestNeed(r);
  return h('div', { class: `score-card score-card--${r.status}`, 'aria-live': 'polite' }, [
    h('div', { class: 'score-card__main' }, [
      h('div', { class: 'score-card__number' }, [
        r.stars === null ? h('span', { class: 'score-card__dash', text: '—' })
          : h('span', { class: 'score-card__value', text: r.stars.toFixed(1) }),
        h('span', { class: 'score-card__outof', text: '/ 5' }),
      ]),
      h('div', {}, [
        r.stars === null ? null : stars(r.stars),
        h('p', { class: 'score-card__label', text: r.blocked ? "You can't get in" : STATUS_META[r.status].label }),
        h('p', { class: 'score-card__for', text: needs.length
          ? `for ${needs.map(needLabel).join(' · ').toLowerCase()}`
          : 'averaged across every access need — set a profile for your own score' }),
      ]),
    ]),
    h('div', { class: 'coverage' }, [
      h('div', { class: 'coverage__bar' }, [
        h('span', { style: `width:${r.coverage.pct}%` }),
      ]),
      h('p', { class: 'coverage__text', text: `We know ${r.coverage.known} of ${r.coverage.total} things that matter to you (${r.coverage.pct}% covered). Anything unknown is counted as unknown, never as fine.` }),
    ]),
    worst && !r.blocked && worst.score < 0.6
      ? h('p', { class: 'score-card__note', text: `Weakest for you: ${needLabel(worst.id).toLowerCase()}.` })
      : null,
  ]);
}

function blockerPanel(r) {
  return h('div', { class: 'blockers' }, [
    h('h2', { text: r.blockers.length === 1 ? 'One thing stops you here' : `${r.blockers.length} things stop you here` }),
    h('p', { class: 'blockers__why', text: 'These are not low scores — they are hard stops, so no star rating is worth showing on its own.' }),
    h('ul', {}, r.blockers.map(b => h('li', {}, [
      h('b', { text: b.label + ': ' }), b.text,
      h('span', { class: 'need-chip need-chip--warn', text: `blocks ${needLabel(b.needId).toLowerCase()}` }),
    ]))),
  ]);
}

function focusFeature(f) {
  detailMap?.flyTo(f.lng, f.lat, 19);
  detailMap?.highlightFeature(f.name);
  document.querySelector('.detail-map')?.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function featureRow(venue, f) {
  const meta = FEATURE_KINDS[f.kind] ?? { label: f.kind, icon: '📍' };
  return h('li', { class: 'feature' }, [
    h('button', {

      h('span', {}, [
        h('span', { class: 'feature__name', text: f.name }),
        h('span', { class: 'feature__kind', text: meta.label }),
        h('span', { class: 'feature__detail', text: f.detail }),
        h('span', { class: 'feature__locate', text: 'Show me where ↗' }),
      ]),
    ]),
  ]);
}

function detailRow(row, muted = false) {
  return h('li', { class: `row row--${row.tone}${muted ? ' row--muted' : ''}` }, [
    h('span', { class: 'row__dot', 'aria-hidden': 'true' }),
    h('span', { class: 'row__body' }, [

      h('span', { class: 'row__foot' }, [
        row.needs.length ? needChips(row.needs.map(n => n.id)) : null,
        row.verified ? h('span', { class: `row__verified${row.stale ? ' is-stale' : ''}`,
          text: `${sourceLabel(row.source)} · ${formatVerified(row.verified)}` }) : null,
      ]),
    ]),
  ]);
}

function staleSection(venue, r, rerender) {
  const stale = r.rows.filter(row => row.stale && row.value);
  if (!stale.length) return null;
  return h('div', { class: 'stale' }, [
    h('h2', { text: 'Is this still true?' }),
    h('p', { class: 'hint', text: 'Accessibility data rots. Lifts break, ramps get removed in refits. These facts have not been checked in over a year — if you are here, you can settle it in one tap.' }),
    ...stale.map(row => h('div', { class: 'stale__item' }, [
      h('p', {}, [h('b', { text: row.label + ': ' }), row.text]),
      h('p', { class: 'hint', text: formatVerified(row.verified) }),
      store.hasContributed(venue.id, row.attrId)
        ? h('p', { class: 'thanks', text: '✓ Thanks — re-confirmed just now.' })
        : h('div', { class: 'stale__actions' }, [
          h('button', { class: 'btn btn--small', type: 'button', text: 'Yes, still true',
            onclick: () => { store.confirm(venue.id, row.attrId); rerender(); } }),
          h('button', { class: 'btn btn--small btn--ghost', type: 'button', text: "No, it's changed",
            onclick: () => { document.querySelector('#gaps')?.scrollIntoView({ behavior: 'smooth' }); } }),
        ]),
    ])),
  ]);
}

function gapsSection(venue, r, rerender) {
  const gaps = r.rows.filter(row => !row.value).slice(0, 4);
  // Questions the user has already answered stay on screen as a receipt, rather
  // than silently vanishing the moment they are tapped.
  const answered = r.rows.filter(row => row.value && store.hasContributed(venue.id, row.attrId));
  if (!gaps.length && !answered.length) return null;

  return h('div', { class: 'gaps', id: 'gaps' }, [
    h('h2', { text: gaps.length ? 'Fill a gap in 5 seconds' : 'Thanks for filling the gaps' }),
    gaps.length ? h('p', { class: 'hint', text: 'One question, one tap. These are the unknowns that affect your profile most — answering changes your score immediately.' }) : null,
    ...answered.map(row => h('div', { class: 'gap' }, [
      h('p', { class: 'thanks', text: `✓ Thanks — you added “${ATTR_BY_ID[row.attrId].label}”.` }),
      h('p', { class: 'hint', text: row.text }),
    ])),
    ...gaps.map(row => {
      const attr = ATTR_BY_ID[row.attrId];
      return h('div', { class: 'gap' }, [
        h('p', { class: 'gap__q', text: attr.label + '?' }),
        h('div', { class: 'gap__opts' }, Object.entries(attr.values).map(([value, text]) =>
          h('button', {
            class: 'btn btn--small btn--outline', type: 'button', text,
            onclick: () => { store.contribute(venue.id, row.attrId, value); rerender(); },
          }))),
      ]);
    }),
  ]);
}

function reviewsSection(venue, needs) {
  const all = sortReviewsForProfile(reviewsFor(venue.id), needs);
  const mine = new Set(needs);

  return section(`Reviews (${all.length})`, [
    all.length
      ? h('p', { class: 'hint', text: 'Every review says who wrote it. Reviews from people who share your access needs are shown first — four stars means nothing until you know whose four stars it is.' })
      : h('p', { class: 'hint', text: 'No reviews yet.' }),
    h('ul', { class: 'reviews' }, all.map(rev => {
      const shared = rev.needs.filter(n => mine.has(n));
      return h('li', { class: `review${shared.length ? ' review--match' : ''}` }, [
        h('div', { class: 'review__head' }, [
          h('div', {}, [
            h('b', { text: rev.author }),
            needChips(rev.needs),
          ]),
          stars(rev.stars),
        ]),
        shared.length ? h('p', { class: 'review__match', text: `Shares your ${shared.map(needLabel).join(' and ').toLowerCase()}` }) : null,
        h('p', { class: 'review__body', text: rev.body }),
      ]);
    })),
  ]);
}

// ---- profile dialog ------------------------------------------------------

function openProfileDialog() {
  const dlg = $('#profile-dialog');
  const account = store.getAccount();
  let picked = new Set(account?.needs ?? []);

  dlg.replaceChildren(
    h('form', { method: 'dialog', class: 'dialog' }, [
      h('h2', { text: 'Your access profile' }),
      h('p', { class: 'hint', text: 'Change this and every score on the map is recalculated for the new you. Same places, different map.' }),
      h('div', { class: 'chip-grid' }, NEEDS.map(n => {
        const btn = h('button', {
          class: `chip${picked.has(n.id) ? ' is-on' : ''}`, type: 'button',
          'aria-pressed': String(picked.has(n.id)),
          onclick: () => {
            picked.has(n.id) ? picked.delete(n.id) : picked.add(n.id);
            btn.setAttribute('aria-pressed', String(picked.has(n.id)));
            btn.classList.toggle('is-on', picked.has(n.id));
          },
        }, [h('span', { class: 'chip__icon', 'aria-hidden': 'true', text: n.icon }), n.label]);
        return btn;
      })),
      h('div', { class: 'dialog__actions' }, [
        h('button', { class: 'btn btn--ghost', type: 'button', text: 'Sign out',
          onclick: () => { dlg.close(); store.signOut(); } }),
        h('button', { class: 'btn btn--primary', type: 'button', text: 'Save profile',
          onclick: () => { store.setNeeds([...picked]); dlg.close(); } }),
      ]),
    ]),
  );
  dlg.showModal();
}

function renderTopbar() {
  const account = store.getAccount();
  const btn = $('#profile-btn');
  if (!account) { btn.hidden = true; return; }
  btn.hidden = false;
  btn.replaceChildren(
    h('span', { class: 'avatar', 'aria-hidden': 'true', text: (account.name[0] ?? '?').toUpperCase() }),
    h('span', { class: 'profile-btn__text' }, [
      h('b', { text: account.name }),
      h('span', { text: account.needs.length ? account.needs.map(needLabel).join(' · ') : 'No needs set' }),
    ]),
    h('span', { 'aria-hidden': 'true', text: '▾' }),
  );
  btn.setAttribute('aria-label', `Your profile: ${account.name}. ${account.needs.map(n => NEED_BY_ID[n].label).join(', ') || 'No access needs set'}. Change profile.`);
}

// ===== js/app.js =====================================================
// App shell: hash routing, and re-rendering whenever the profile changes.



const screens = {
  onboarding: document.querySelector('#screen-onboarding'),
  map: document.querySelector('#screen-map'),
  venue: document.querySelector('#screen-venue'),
};

document.querySelector('#profile-btn').addEventListener('click', openProfileDialog);

const goto = hash => { location.hash = hash; };
const show = name => {
  for (const [key, node] of Object.entries(screens)) node.hidden = key !== name;
};

function render() {
  renderBrand();
  renderTopbar();

  if (!store.isSignedIn()) {
    show('onboarding');
    renderOnboarding(screens.onboarding);
    return;
  }

  const match = location.hash.match(/^#\/v\/(.+)$/);
  if (match) {
    show('venue');
    renderVenueScreen(screens.venue, decodeURIComponent(match[1]), {
      onBack: () => goto('#/'),
      rerender: render,
    });
    return;
  }

  show('map');
  renderMapScreen(screens.map, {
    onOpenVenue: id => goto(`#/v/${encodeURIComponent(id)}`),
  });
}

window.addEventListener('hashchange', render);
store.subscribe(render);
render();
</script>
