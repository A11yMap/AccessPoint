<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Accessibility map</title>
  <meta name="description" content="Accessibility scored for you, not for an average person who doesn't exist.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>♿</text></svg>">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="topbar">
    <a class="brand" href="#/">
      <span class="brand__mark" aria-hidden="true">◍</span>
      <span class="brand__text">
        <span id="brand-name"></span>
        <span id="brand-sub" class="brand__sub"></span>
      </span>
    </a>
    <button id="profile-btn" class="profile-btn" type="button" hidden></button>
  </header>

  <main id="main">
    <section id="screen-onboarding" class="screen screen--onboarding" hidden></section>
    <section id="screen-map" class="screen screen--map" hidden></section>
    <section id="screen-venue" class="screen screen--venue" hidden></section>
  </main>

  <dialog id="profile-dialog"></dialog>

  <script type="module" src="js/app.js"></script>
</body>
</html>
